<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethan Mixter Arcade</title>
<meta name="description" content="Ethan Mixter's browser games, set up as a 3D arcade. Kepler Drift, FPS Chess, Coffee Shop Tycoon, Red Shirt Kid, Repulsor Forge, Foam Forge, Pontoon Battle and Forgeframe Duel.">
<meta property="og:title" content="Ethan Mixter Arcade">
<meta property="og:description" content="Click a cabinet to see it up close, then hit play.">
<meta property="og:image" content="https://ethanmixter.com/arcade/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/ethan-player-1-avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D hall seen from the entrance; click a cabinet and the camera glides up to its screen, with the game card docked bottom-centre. */
  :root {
    color-scheme: dark;
    --void: #07050f;        /* the room's darkness */
    --panel: #120d22;       /* HUD glass */
    --panel-edge: #2c2350;
    --ink: #f1ecff;
    --ink-dim: #a69cc8;
    --pink: #ff2ea0;        /* back-wall neon */
    --cyan: #1ed9ff;
    --coin: #ffd23f;        /* insert-coin yellow */
    --acc: var(--cyan);     /* swapped per cabinet */
    --f-display: "Bungee", "Impact", "Arial Black", system-ui, sans-serif;
    --f-body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--void); color: var(--ink);
    font-family: var(--f-body); font-size: 15px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; outline: none; }
  #stage.hot canvas { cursor: pointer; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--coin); outline-offset: 3px; }

  /* ---------- HUD chrome ---------- */
  .hud-top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .brand { display: flex; align-items: center; gap: 10px; pointer-events: auto; text-decoration: none; }
  .brand img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--pink); box-shadow: 0 0 12px rgb(255 46 160 / .6); }
  .brand b { font-family: var(--f-display); font-weight: 400; font-size: 15px; letter-spacing: .04em; line-height: 1; text-shadow: 0 0 10px rgb(255 46 160 / .7); }
  .brand small { display: block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .18em; color: var(--cyan); margin-top: 3px; }
  .tools { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 6px;
    background: rgb(18 13 34 / .78); border: 1px solid var(--panel-edge); backdrop-filter: blur(6px);
    font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-decoration: none; cursor: pointer;
  }
  .chip:hover { border-color: var(--cyan); color: #fff; }

  /* overview prompt + hover label */
  #prompt {
    position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; white-space: nowrap;
    background: rgb(18 13 34 / .78); border: 1px solid var(--panel-edge); backdrop-filter: blur(6px);
    font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .06em; color: var(--ink-dim);
    transition: opacity .25s ease; pointer-events: none;
  }
  #prompt b { color: var(--coin); font-weight: 500; }
  #prompt button { pointer-events: auto; background: none; border: 0; border-left: 1px solid var(--panel-edge); padding: 2px 0 2px 10px; margin-left: 2px;
    font: inherit; letter-spacing: inherit; color: var(--ink); cursor: pointer; }
  #prompt button:hover { color: var(--coin); }
  #prompt.off { opacity: 0; }
  #prompt.off button { pointer-events: none; }
  #tip {
    position: fixed; z-index: 6; left: 0; top: 0; pointer-events: none; padding: 7px 11px; border-radius: 6px;
    background: rgb(10 7 22 / .9); border: 1px solid var(--acc); box-shadow: 0 0 16px color-mix(in srgb, var(--acc) 45%, transparent);
    font-family: var(--f-display); font-size: 14px; letter-spacing: .03em; white-space: nowrap; color: #fff;
  }
  #tip small { display: block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; color: var(--acc); margin-top: 2px; }

  /* ---------- game card (shown at a cabinet) ---------- */
  #card {
    position: fixed; z-index: 6; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    width: min(520px, calc(100% - 32px)); transform: translate(-50%, 18px); opacity: 0; visibility: hidden;
    transition: opacity .22s ease, transform .22s ease, visibility 0s linear .22s;
    background: linear-gradient(180deg, rgb(20 14 40 / .93), rgb(10 7 22 / .95));
    border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent); border-radius: 10px;
    box-shadow: 0 0 0 1px rgb(0 0 0 / .4), 0 0 28px color-mix(in srgb, var(--acc) 35%, transparent), 0 18px 50px rgb(0 0 0 / .6);
    padding: 16px 18px; display: grid; gap: 10px; backdrop-filter: blur(8px);
  }
  #card.show { opacity: 1; transform: translate(-50%, 0); visibility: visible; transition: opacity .22s ease, transform .22s ease; }
  #card .tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--acc); }
  #card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.05; text-wrap: balance; color: #fff; text-shadow: 0 0 14px color-mix(in srgb, var(--acc) 70%, transparent); }
  #card p { margin: 0; color: var(--ink-dim); font-size: 14.5px; max-width: 60ch; }
  #card .how { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-dim); }
  #card .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  #card .row .spacer { flex: 1; }
  #card .count { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-dim); min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
  .back { height: 44px; padding: 0 14px; font-size: 13px; }
  .nav { width: 44px; height: 44px; padding: 0; font-size: 18px; }
  .play {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 44px; padding: 0 20px; border-radius: 6px; text-decoration: none;
    background: var(--coin); color: #1a1200; font-family: var(--f-display); font-size: 17px; letter-spacing: .04em;
    box-shadow: 0 0 18px rgb(255 210 63 / .55), inset 0 -3px 0 rgb(0 0 0 / .25); cursor: pointer; border: 0;
  }
  .play:hover { filter: brightness(1.08); }

  /* ---------- loading overlay ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow-y: auto;
    background: radial-gradient(ellipse at 50% 40%, rgb(7 5 15 / .55), rgb(7 5 15 / .95) 70%);
    padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 24px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: opacity .6s ease;
  }
  #gate.gone { opacity: 0; pointer-events: none; }
  .gate-inner { width: min(560px, 100%); display: grid; gap: 16px; justify-items: center; text-align: center; }
  .gate-title { margin: 0; font-family: var(--f-display); font-weight: 400; line-height: .92; font-size: clamp(42px, 10vw, 82px); color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 22px var(--pink), 0 0 48px var(--pink); }
  .gate-title span { display: block; font-size: .5em; letter-spacing: .28em; margin-top: .25em; color: var(--cyan);
    text-shadow: 0 0 6px #b8f4ff, 0 0 20px var(--cyan), 0 0 44px var(--cyan); padding-left: .28em; }
  .gate-lede { margin: 0; color: var(--ink-dim); font-size: 16px; max-width: 46ch; text-wrap: pretty; }
  .meter { width: min(260px, 70%); height: 6px; border-radius: 3px; background: var(--panel); border: 1px solid var(--panel-edge); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--coin); box-shadow: 0 0 10px var(--coin); transition: width .2s ease; }
  .gate-status { font-family: var(--f-mono); font-size: 12px; letter-spacing: .24em; color: var(--coin); }
  .gate-alt { font-size: 13.5px; color: var(--ink-dim); }
  .gate-alt button { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--ink); }

  /* ---------- list view (also the no-WebGL fallback) ---------- */
  #list {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: rgb(7 5 15 / .97);
    padding-block: calc(env(safe-area-inset-top, 0px) + 22px) calc(env(safe-area-inset-bottom, 0px) + 30px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .list-wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .list-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
  .game { display: grid; grid-template-rows: auto 1fr; border-radius: 8px; overflow: hidden; background: var(--panel); border: 1px solid var(--panel-edge); text-decoration: none; min-width: 0; }
  .game:hover { border-color: var(--g); box-shadow: 0 0 18px color-mix(in srgb, var(--g) 35%, transparent); }
  .game img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #000; }
  .game div { padding: 12px 14px 14px; display: grid; gap: 4px; align-content: start; }
  .game .tag { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--g); }
  .game h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 18px; }
  .game p { margin: 0; color: var(--ink-dim); font-size: 14px; }

  #flash { position: fixed; inset: 0; z-index: 30; background: #000; opacity: 0; pointer-events: none; display: grid; place-items: center; transition: opacity .35s ease; }
  #flash.on { opacity: 1; }
  #flash b { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 6vw, 54px); color: var(--coin); text-shadow: 0 0 18px var(--coin); text-align: center; padding: 0 16px; }

  @media (max-width: 560px) {
    .brand b { font-size: 13px; }
    .chip span.long { display: none; }
    #card { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding: 14px; }
    #card h2 { font-size: 22px; }
    #card p { font-size: 14px; }
    .back { padding: 0 10px; }
    .play { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #card, #gate, #flash, #prompt { transition: none; }
  }
</style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>

<header class="hud-top">
  <a class="brand" href="https://ethanmixter.com/" aria-label="Ethan Mixter home">
    <img src="arcade/avatar.jpg" alt="" width="34" height="34">
    <span><b>Ethan Mixter</b><small>ARCADE</small></span>
  </a>
  <nav class="tools" aria-label="Arcade tools">
    <button class="chip" id="listBtn" type="button">☰ <span class="long">All games</span></button>
    <button class="chip" id="soundBtn" type="button" aria-pressed="true">♪ <span class="long">Sound</span> on</button>
    <a class="chip" href="classic.html">Classic</a>
    <a class="chip" href="https://github.com/ethanmixter" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<div id="prompt" class="off"><b>▶</b> <span id="promptText">Click a cabinet to take a look</span> <button type="button" id="browse">or browse <span aria-hidden="true">›</span></button></div>
<div id="tip" hidden></div>

<section id="card" aria-live="polite" aria-label="Selected game">
  <div class="tag" id="cTag">Arcade</div>
  <h2 id="cTitle">Game</h2>
  <p id="cBlurb"></p>
  <span class="how" id="cHow"></span>
  <div class="row">
    <button class="chip back" id="cBack" type="button">← Back</button>
    <span class="spacer"></span>
    <button class="chip nav" id="cPrev" type="button" aria-label="Previous cabinet">‹</button>
    <span class="count" id="cCount">1 / 9</span>
    <button class="chip nav" id="cNext" type="button" aria-label="Next cabinet">›</button>
    <a class="play" id="cPlay" href="#">PLAY ▶</a>
  </div>
</section>

<div id="gate">
  <div class="gate-inner">
    <h1 class="gate-title">Ethan Mixter<span>Arcade</span></h1>
    <p class="gate-lede" id="gateLede">Every game I've made is plugged in and running. Click a cabinet to see it up close, then hit play.</p>
    <div class="meter" aria-hidden="true"><i id="bar"></i></div>
    <div class="gate-status" id="gateStatus">LOADING <span id="pct">0%</span></div>
    <div class="gate-alt">Just want the list? <button type="button" id="gateList">See all games</button></div>
  </div>
</div>

<section id="list" hidden aria-labelledby="listTitle">
  <div class="list-wrap">
    <div class="list-head">
      <h2 id="listTitle">All games</h2>
      <button class="chip" id="listClose" type="button">← Back to the arcade</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<div id="flash"><b id="flashText">INSERT COIN</b></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const BASE = 'arcade/';
const SITE = 'https://ethanmixter.com/';
const GAMES = [
  { id: 'kepler-drift', title: 'Kepler Drift', tag: 'Colony builder · 3D turret defense', color: '#6b7aff',
    url: SITE + 'kepler-drift/', how: 'Mouse · keyboard',
    blurb: 'Earth fell to space pirates. Build Brian Wilson a new colony, then defend it in 3D turret battles.' },
  { id: 'fps-chess', title: 'FPS Chess', tag: 'Chess · first-person duels', color: '#ffc233',
    url: SITE + 'fps-chess/', how: 'WASD · mouse aim · click to shoot',
    blurb: 'Play chess against the computer, then fight first-person duels to decide captures.' },
  { id: 'coffee-shop-tycoon', title: 'Coffee Shop Tycoon', tag: 'Tycoon · management', color: '#1ccc80',
    url: 'https://ethanmixter.github.io/coffee_shop_tycoon/', how: 'WASD · Space to brew',
    blurb: 'Manage growth, upgrades, and daily choices in an approachable tycoon experience.' },
  { id: 'red-shirt-kid', title: 'Red Shirt Kid', tag: 'Retro platformer', color: '#ff2a2a',
    url: 'https://ethanmixter.github.io/redshirtkid/', how: 'Arrows / WASD · Space jump · touch',
    blurb: 'A retro platform game with arcade controls, coins, enemies, and mobile support.' },
  { id: 'repulsor-forge', title: 'Repulsor Forge', tag: 'Arena shooter · upgrades', color: '#22c7f2',
    url: SITE + 'repulsor-forge/', how: 'WASD · mouse aim · Shift dash',
    blurb: 'Battle war machines, collect their bounty, and upgrade a powerful repulsor gauntlet.' },
  { id: 'foam-forge', title: 'Foam Forge', tag: 'Blaster builder · Bot Quests', color: '#b3eb1a',
    url: SITE + 'foam-forge/', how: 'Mouse · keyboard',
    blurb: 'Build foam blasters, unlock special abilities, practice at the range, and clear Bot Quests.' },
  { id: 'pontoon-battle', title: 'Pontoon Battle', tag: 'Tubing battle · 2D', color: '#ff6633',
    url: SITE + 'vermilion-tubing/', how: 'A/D or arrows · touch buttons',
    blurb: 'Ride behind a pontoon boat, sling your tube across the wake, and smash the AI robot rider.' },
  { id: 'forgeframe-duel', title: 'Forgeframe Duel', tag: 'Giant robot 1v1', color: '#ff38a8',
    url: SITE + 'forgeframe-duel/', how: 'A/D move · J/K/L attacks',
    blurb: 'Choose a transforming war machine, customize its loadout, and battle through 3D arena duels.' },
];
const GITHUB = { id: 'github', title: 'More on GitHub', tag: 'Source code · experiments', color: '#9b7bff',
  url: 'https://github.com/ethanmixter', how: 'Opens in a new tab',
  blurb: 'Every game here is open source. Browse the code, the build notes, and what is in progress.' };
const ALL = [...GAMES, GITHUB];

const $ = (s) => document.querySelector(s);
const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();
const isTouch = matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
if (isTouch) document.body.classList.add('touch');

/* ---------------- list view (also the fallback) ---------------- */
const grid = $('#grid');
for (const g of ALL) {
  const a = document.createElement('a');
  a.className = 'game'; a.href = g.url; a.style.setProperty('--g', g.color);
  if (g.id === 'github' || inFrame) { a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = (g.id === 'github' ? '' : `<img src="${BASE}screens/${g.id}-1.jpg" alt="" loading="lazy" width="640" height="480">`) +
    `<div><span class="tag">${g.tag}</span><h3>${g.title}</h3><p>${g.blurb}</p></div>`;
  grid.appendChild(a);
}
const list = $('#list');
const openList = () => { list.hidden = false; $('#listClose').focus(); };
$('#listBtn').onclick = openList;
$('#gateList').onclick = openList;
$('#listClose').onclick = () => { list.hidden = true; };

/* ---------------- sound (tiny synth, starts on first click) ---------------- */
let actx = null, soundOn = true;
try { soundOn = localStorage.getItem('arcade-sound') !== 'off'; } catch {}
const soundBtn = $('#soundBtn');
const paintSound = () => { soundBtn.setAttribute('aria-pressed', soundOn); soundBtn.lastChild.textContent = soundOn ? ' on' : ' off'; };
paintSound();
soundBtn.onclick = () => { soundOn = !soundOn; paintSound(); try { localStorage.setItem('arcade-sound', soundOn ? 'on' : 'off'); } catch {} };
function blip(notes, type = 'square', dur = 0.07, vol = 0.05) {
  if (!soundOn) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    for (const f of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      t += dur * 0.9;
    }
  } catch {}
}

/* ---------------- renderer ---------------- */
const stage = $('#stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('#gateLede').textContent = "Your browser couldn't start 3D graphics, so here's the full game list instead.";
  openList();
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
stage.appendChild(renderer.domElement);
renderer.domElement.tabIndex = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#07050f');
scene.fog = new THREE.FogExp2('#07050f', 0.034);
const fovFor = (a) => (a < 1 ? 62 + 24 * (1 - a) : 70);
const camera = new THREE.PerspectiveCamera(fovFor(innerWidth / innerHeight), innerWidth / innerHeight, 0.05, 80);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.42, 0.45, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight('#9d8cff', '#1a0f2e', 1.1));
const top = new THREE.DirectionalLight('#ffe9d6', 0.9);
top.position.set(0.3, 1, 0.2);
scene.add(top);

/* ---------------- loading ---------------- */
const manager = new THREE.LoadingManager();
manager.onProgress = (_u, done, total) => { const p = $('#pct'); if (p) p.textContent = Math.round((done / total) * 100) + '%'; };
const texLoader = new THREE.TextureLoader(manager);
const loadTex = (path, srgb = true, flip = false) => {
  const t = texLoader.load(BASE + path);
  t.flipY = flip;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
};

const LM_SCALE = 8.324; // written by the Blender bake (lm.json); updated below if fetch works
const lmScale = { v: LM_SCALE };
fetch(BASE + 'lm/lm.json').then((r) => r.json()).then((j) => { lmScale.v = j.scale; applyLM(); }).catch(() => {});

const roomMats = {};
const ROOM = {
  Floor:      { color: '#ffffff', map: true },
  Ceiling:    { color: '#2a2440' },
  Wall_L:     { color: '#3a2c66' },
  Wall_R:     { color: '#3a2c66' },
  Wall_Back:  { color: '#2e2552' },
  Wall_Front: { color: '#2e2552' },
};
const LM_GAIN = { Floor: 0.85, Ceiling: 0.45, Wall_L: 0.5, Wall_R: 0.5, Wall_Back: 0.55, Wall_Front: 0.55 };
for (const [name, o] of Object.entries(ROOM)) {
  const lm = loadTex(`lm/lm_${name}.png`);
  const m = new THREE.MeshBasicMaterial({ color: o.color, lightMap: lm });
  if (o.map) {
    const carpet = loadTex('tex/carpet.jpg', true, true);
    carpet.wrapS = carpet.wrapT = THREE.RepeatWrapping;
    carpet.repeat.set(8 / 2.2, 24 / 2.2);
    m.map = carpet;
  }
  roomMats[name] = m;
}
function applyLM() { for (const [n, m] of Object.entries(roomMats)) m.lightMapIntensity = lmScale.v * Math.PI * LM_GAIN[n]; }
applyLM();

/* CRT screen shader: crossfades two screenshots, adds scanlines + curvature */
const crtVert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const crtFrag = `
  uniform sampler2D a; uniform sampler2D b; uniform float mixT; uniform float t; uniform float gain; uniform float noise;
  varying vec2 vUv;
  float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
  void main(){
    vec2 c = vUv - 0.5; float r2 = dot(c,c);
    vec2 uv = 0.5 + c * (1.0 + 0.10 * r2);
    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) { gl_FragColor = vec4(0.0,0.0,0.0,1.0); return; }
    vec3 col = mix(texture2D(a, uv).rgb, texture2D(b, uv).rgb, smoothstep(0.0, 1.0, mixT));
    col *= 0.82 + 0.18 * sin(uv.y * 900.0);
    col *= 1.0 - 0.55 * smoothstep(0.12, 0.34, r2);
    col += noise * (h(uv * 400.0 + t) - 0.5) * 0.35;
    col *= gain * (0.985 + 0.015 * sin(t * 50.0));
    gl_FragColor = vec4(col, 1.0);
    #include <colorspace_fragment>
  }`;

function marqueeTexture(g) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 480;
  const x = c.getContext('2d');
  const grad = x.createLinearGradient(0, 0, 0, 480);
  grad.addColorStop(0, '#0b0818'); grad.addColorStop(0.5, '#170f2c'); grad.addColorStop(1, '#0b0818');
  x.fillStyle = grad; x.fillRect(0, 0, 1024, 480);
  // sunburst in the cabinet colour
  x.save(); x.translate(512, 520); x.globalAlpha = 0.18; x.fillStyle = g.color;
  for (let i = 0; i < 18; i++) { x.rotate(Math.PI / 18); x.beginPath(); x.moveTo(0, 0); x.lineTo(-60, -700); x.lineTo(60, -700); x.fill(); }
  x.restore();
  x.strokeStyle = g.color; x.lineWidth = 10; x.strokeRect(14, 14, 996, 452);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  let size = 150;
  x.font = `${size}px Bungee, Impact, sans-serif`;
  const words = g.title.toUpperCase();
  while (x.measureText(words).width > 900 && size > 60) { size -= 6; x.font = `${size}px Bungee, Impact, sans-serif`; }
  x.shadowColor = g.color; x.shadowBlur = 40; x.fillStyle = '#ffffff';
  x.fillText(words, 512, 220);
  x.shadowBlur = 0; x.lineWidth = 4; x.strokeStyle = g.color; x.strokeText(words, 512, 220);
  x.font = '600 40px "IBM Plex Mono", monospace'; x.fillStyle = g.color;
  x.fillText(g.id === 'github' ? 'SOURCE · OPEN' : 'FREE PLAY · 1 PLAYER', 512, 390);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.flipY = false;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function githubScreen() {
  const c = document.createElement('canvas'); c.width = 640; c.height = 480;
  const x = c.getContext('2d');
  x.fillStyle = '#0d0820'; x.fillRect(0, 0, 640, 480);
  x.strokeStyle = 'rgba(155,123,255,.25)'; x.lineWidth = 1;
  for (let i = 0; i < 640; i += 32) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 480); x.stroke(); }
  for (let i = 0; i < 480; i += 32) { x.beginPath(); x.moveTo(0, i); x.lineTo(640, i); x.stroke(); }
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.shadowColor = '#9b7bff'; x.shadowBlur = 24;
  x.font = '64px Bungee, Impact, sans-serif'; x.fillText('MORE ON', 320, 170); x.fillText('GITHUB', 320, 245);
  x.shadowBlur = 0; x.fillStyle = '#c7b8ff'; x.font = '500 26px "IBM Plex Mono", monospace';
  x.fillText('github.com/ethanmixter', 320, 320);
  x.fillStyle = '#ffd23f'; x.fillText('▶ OPEN', 320, 395);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.flipY = false; return t;
}

const cabinets = []; // {g, cab, screen, sp, n, uniforms, light}
const pickables = [];

const fontsReady = Promise.race([
  Promise.all([document.fonts.load('80px Bungee'), document.fonts.load('600 40px "IBM Plex Mono"')]),
  new Promise((r) => setTimeout(r, 2500)),
]).catch(() => {});

new GLTFLoader(manager).load(BASE + 'arcade.gltf.json', async (gltf) => {
  await fontsReady;
  const root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isMesh) return;
    const nodeName = o.name.replace(/_\d+$/, '');
    if (ROOM[o.name] || ROOM[nodeName]) { o.material = roomMats[ROOM[o.name] ? o.name : nodeName]; return; }
    const m = o.material;
    if (m && m.emissive && m.emissiveIntensity > 1) {
      // Blender strengths are tuned for the bake; on screen keep neon bright but not blown out
      const cap = m.name === 'Neon_White' ? 1.4 : m.name.startsWith('Btn_') ? 1.3 : /^Neon_(Pink|Cyan|Purple)$/.test(m.name) ? 1.7 : 2.4;
      m.emissiveIntensity = Math.min(m.emissiveIntensity, cap);
      m.toneMapped = false;
    }
  });
  for (const g of ALL) {
    const cab = root.getObjectByName('Cabinet_' + g.id);
    const screen = root.getObjectByName('Screen_' + g.id);
    const marquee = root.getObjectByName('Marquee_' + g.id);
    const anchor = root.getObjectByName('Play_' + g.id);
    if (!cab || !screen || !anchor) continue;
    let uniforms = null;
    if (g.id === 'github') {
      screen.material = new THREE.MeshBasicMaterial({ map: githubScreen(), toneMapped: false });
      screen.material.color.setScalar(1.15);
    } else {
      uniforms = {
        a: { value: loadTex(`screens/${g.id}-1.jpg`) }, b: { value: loadTex(`screens/${g.id}-2.jpg`) },
        mixT: { value: 0 }, t: { value: 0 }, gain: { value: 1.05 }, noise: { value: 0 },
      };
      screen.material = new THREE.ShaderMaterial({ uniforms, vertexShader: crtVert, fragmentShader: crtFrag, toneMapped: false });
    }
    if (marquee) {
      marquee.material = new THREE.MeshBasicMaterial({ map: marqueeTexture(g), toneMapped: false });
      marquee.material.color.setScalar(1.25);
    }
    const sp = new THREE.Box3().setFromObject(screen).getCenter(new THREE.Vector3()); // mesh origin sits at the cabinet base
    const ap = new THREE.Vector3(); anchor.getWorldPosition(ap);
    // the screen's facing direction (tilted back like a real cabinet), used to frame the close-up
    const h = new THREE.Vector3(ap.x - sp.x, 0, ap.z - sp.z).normalize();
    const n = new THREE.Vector3(h.x * 0.975, 0.22, h.z * 0.975).normalize(); // screen leans back ~13°
    const light = new THREE.PointLight(g.color, 3, 4.2, 1.5);
    light.position.copy(sp).lerp(ap, 0.35); light.position.y = 1.5;
    scene.add(light);
    cab.traverse((o) => { if (o.isMesh) { o.userData.cab = g.id; pickables.push(o); } });
    cabinets.push({ g, cab, screen, sp, n, uniforms, light, phase: Math.random() * 8 });
  }
  manager.onLoad = ready;
  if (!texLoader.manager.isLoading) ready();
}, undefined, (err) => {
  console.error(err);
  $('#gateLede').textContent = "The arcade couldn't load. Here's the full game list instead.";
  openList();
});


/* ---------------- camera rig: overview <-> close-up on one cabinet ---------------- */
// cabinets in walking order around the hall, so ‹ › feels like stepping to the neighbour
const ORDER = ['kepler-drift', 'fps-chess', 'coffee-shop-tycoon', 'red-shirt-kid', 'github',
  'forgeframe-duel', 'pontoon-battle', 'foam-forge', 'repulsor-forge'];
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const OVERVIEW = { pos: new THREE.Vector3(0, 1.85, 4.4), target: new THREE.Vector3(0, 1.0, -9) };
const INTRO = { pos: new THREE.Vector3(0, 2.3, 4.9), target: new THREE.Vector3(0, 1.4, -9) };
const poseQuat = (pos, target) => new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(pos, target, new THREE.Vector3(0, 1, 0)));
const ovQuat = poseQuat(OVERVIEW.pos, OVERVIEW.target);

camera.position.copy(INTRO.pos);
camera.quaternion.copy(poseQuat(INTRO.pos, INTRO.target));

let mode = 'loading';          // loading | overview | flying | focus
let current = null;            // focused cabinet
let hover = null;
let flight = null;             // {p0,q0,p1,q1,t0,dur,then}
const parallax = { x: 0, y: 0, tx: 0, ty: 0 };

function focusPose(c) {
  const v = THREE.MathUtils.degToRad(camera.fov);
  const tanH = Math.tan(v / 2);
  const cardH = card.offsetHeight + 40;                  // space the card takes at the bottom
  const free = Math.max(0.35, 1 - cardH / innerHeight);   // fraction of the screen left above the card
  // frame the screen plus the lit marquee above it (about 0.8 x 1.0 m) inside the free area
  const focus = c.sp.clone(); focus.y += 0.2;
  const dH = 1.0 / (0.92 * free * 2 * tanH);
  const dW = 0.8 / (0.9 * 2 * tanH * camera.aspect);
  const d = Math.min(3, Math.max(0.8, dH, dW));
  const pos = focus.clone().addScaledVector(c.n, d);
  // aim low so the cabinet sits centred in the space above the card
  const visH = 2 * d * tanH;
  const target = focus.clone(); target.y -= (1 - free) / 2 * visH;
  return { pos, quat: poseQuat(pos, target) };
}

function fly(pos, quat, dur, then) {
  flight = { p0: camera.position.clone(), q0: camera.quaternion.clone(), p1: pos, q1: quat,
    t0: performance.now(), dur: reduceMotion ? 1 : dur, then };
  mode = 'flying';
}

function focusOn(c, from = 'click') {
  if (!c || mode === 'loading') return;
  current = c;
  setHover(null);
  showCard(c);
  // card height is known once it's laid out; frame the shot after that
  requestAnimationFrame(() => {
    const { pos, quat } = focusPose(c);
    const far = camera.position.distanceTo(pos);
    fly(pos, quat, Math.min(1.5, 0.55 + far * 0.09), () => { mode = 'focus'; });
  });
  blip(from === 'nav' ? [784] : [660, 988], 'square', 0.05, 0.03);
  $('#prompt').classList.add('off');
  try { sessionStorage.setItem('arcade-last', JSON.stringify({ id: c.g.id, t: Date.now() })); } catch {}
}

function backToOverview() {
  if (mode === 'loading' || (!current && mode !== 'flying')) return;
  current = null;
  card.classList.remove('show');
  fly(OVERVIEW.pos.clone(), ovQuat.clone(), 1.0, () => { mode = 'overview'; $('#prompt').classList.remove('off'); });
  blip([523], 'square', 0.05, 0.025);
  try { sessionStorage.removeItem('arcade-last'); } catch {}
  renderer.domElement.focus({ preventScroll: true });
}

function step(dir) {
  if (!cabinets.length || mode === 'loading') return;
  const ids = ORDER.filter((id) => cabinets.some((c) => c.g.id === id));
  let i = current ? ids.indexOf(current.g.id) : (dir > 0 ? -1 : 0);
  i = (i + dir + ids.length) % ids.length;
  focusOn(cabinets.find((c) => c.g.id === ids[i]), 'nav');
}

/* ---------------- card ---------------- */
const card = $('#card');
const cPlay = $('#cPlay');
function showCard(c) {
  const g = c.g;
  card.style.setProperty('--acc', g.color);
  $('#cTag').textContent = g.tag;
  $('#cTitle').textContent = g.title;
  $('#cBlurb').textContent = g.blurb;
  $('#cHow').textContent = 'Controls: ' + g.how;
  const ids = ORDER.filter((id) => cabinets.some((x) => x.g.id === id));
  $('#cCount').textContent = `${ids.indexOf(g.id) + 1} / ${ids.length}`;
  cPlay.href = g.url;
  cPlay.textContent = g.id === 'github' ? 'OPEN ▶' : 'PLAY ▶';
  if (g.id === 'github' || inFrame) { cPlay.target = '_blank'; cPlay.rel = 'noopener'; } else { cPlay.removeAttribute('target'); }
  card.classList.add('show');
}
$('#cBack').onclick = backToOverview;
$('#cPrev').onclick = () => step(-1);
$('#cNext').onclick = () => step(1);
cPlay.addEventListener('click', (e) => {
  if (!current) return;
  if (current.g.id === 'github' || inFrame) { blip([523, 659, 784, 1047], 'square', 0.06, 0.04); return; } // real link opens a tab
  e.preventDefault();
  play(current.g);
});

let launching = false;
function play(g) {
  if (launching) return;
  blip([523, 659, 784, 1047], 'square', 0.07, 0.045);
  if (g.id === 'github' || inFrame) {
    const a = document.createElement('a'); a.href = g.url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  launching = true;
  $('#flashText').textContent = g.title.toUpperCase();
  $('#flash').classList.add('on');
  setTimeout(() => { location.href = g.url; }, 450);
}
addEventListener('pageshow', (e) => { if (e.persisted) { launching = false; $('#flash').classList.remove('on'); } });

/* ---------------- pointer: hover labels, click to visit ---------------- */
const canvas = renderer.domElement;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tip = $('#tip');
function pickAt(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera); ray.far = 30;
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? cabinets.find((c) => c.g.id === hit.object.userData.cab) : null;
}
function setHover(c, x, y) {
  hover = c;
  stage.classList.toggle('hot', !!c);
  if (!c || isTouch) { tip.hidden = true; return; }
  tip.style.setProperty('--acc', c.g.color);
  const key = c.g.id + (current === c ? ':play' : ':look');
  if (tip.dataset.id !== key) {
    tip.dataset.id = key;
    tip.innerHTML = '';
    tip.append(c.g.title);
    const s = document.createElement('small');
    s.textContent = current === c ? (c.g.id === 'github' ? 'CLICK TO OPEN' : 'CLICK TO PLAY') : 'CLICK TO LOOK';
    tip.append(s);
  }
  tip.hidden = false;
  const w = tip.offsetWidth;
  tip.style.transform = `translate(${Math.min(innerWidth - w - 12, x + 16)}px, ${Math.max(60, y - 44)}px)`;
}
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') {
    parallax.tx = (e.clientX / innerWidth) * 2 - 1;
    parallax.ty = (e.clientY / innerHeight) * 2 - 1;
  }
  if (mode === 'loading' || mode === 'flying' || e.pointerType !== 'mouse') return;
  const c = pickAt(e.clientX, e.clientY);
  // at a cabinet, only the other cabinets (or this screen, to play) are interesting
  setHover(c, e.clientX, e.clientY);
});
canvas.addEventListener('pointerleave', () => setHover(null));
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) { down = null; return; }
  down = null;
  if (mode === 'loading') return;
  const c = pickAt(e.clientX, e.clientY);
  if (!c) return;
  if (current === c && mode === 'focus') play(c.g);
  else focusOn(c);
});

addEventListener('keydown', (e) => {
  if (!list.hidden) { if (e.key === 'Escape') list.hidden = true; return; }
  if (e.target.closest && e.target.closest('a,button') && (e.key === 'Enter' || e.key === ' ')) return; // let buttons work
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if ((e.key === 'Escape' || e.key === 'Backspace') && current) { e.preventDefault(); backToOverview(); }
  else if ((e.key === 'Enter' || e.key === ' ') && current) { e.preventDefault(); play(current.g); }
});

/* ---------------- ready: fade the gate, glide in ---------------- */
let isReady = false;
function ready() {
  if (isReady) return; isReady = true;
  $('#bar').style.width = '100%';
  $('#gate').classList.add('gone');
  let last = null;
  try {
    const s = JSON.parse(sessionStorage.getItem('arcade-last') || 'null');
    if (s && Date.now() - s.t < 3 * 60 * 60 * 1000) last = cabinets.find((c) => c.g.id === s.id);
  } catch {}
  fly(OVERVIEW.pos.clone(), ovQuat.clone(), 1.6, () => {
    mode = 'overview';
    if (last) focusOn(last, 'nav');
    else $('#prompt').classList.remove('off');
  });
}
manager.onProgress = (_u, done, total) => {
  const p = Math.round((done / total) * 100);
  $('#pct').textContent = p + '%'; $('#bar').style.width = p + '%';
};
if (isTouch) $('#promptText').textContent = 'Tap a cabinet to take a look';
$('#browse').onclick = () => step(1);

/* ---------------- loop ---------------- */
const tmpQ = new THREE.Quaternion(), pq = new THREE.Quaternion(), eul = new THREE.Euler(0, 0, 0, 'YXZ');
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;

  if (mode === 'flying' && flight) {
    const k = Math.min(1, (now - flight.t0) / (flight.dur * 1000));
    const e = ease(k);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    camera.position.y += Math.sin(Math.PI * e) * 0.12 * flight.p0.distanceTo(flight.p1) / 4; // a little arc
    camera.quaternion.slerpQuaternions(flight.q0, flight.q1, e);
    if (k >= 1) { const then = flight.then; flight = null; then && then(); }
  } else if (mode === 'overview') {
    // gentle look-around that follows the mouse, plus a slow idle sway
    parallax.x += (parallax.tx - parallax.x) * Math.min(1, dt * 3);
    parallax.y += (parallax.ty - parallax.y) * Math.min(1, dt * 3);
    eul.set(-parallax.y * 0.05, -parallax.x * 0.16 + (reduceMotion ? 0 : Math.sin(t * 0.25) * 0.015), 0);
    pq.setFromEuler(eul);
    tmpQ.copy(ovQuat).multiply(pq);
    camera.quaternion.slerp(tmpQ, Math.min(1, dt * 6));
    camera.position.lerp(OVERVIEW.pos, Math.min(1, dt * 4));
  }

  for (const c of cabinets) {
    const lit = current === c ? 1.6 : hover === c ? 1.0 : 0;
    c.light.intensity += (3.0 + lit - c.light.intensity) * Math.min(1, dt * 6);
    if (!c.uniforms) continue;
    const u = c.uniforms;
    const period = current === c ? 3.0 : 5.5;
    const ph = ((t + c.phase) % (period * 2)) / period;
    u.mixT.value += ((ph < 1 ? 0 : 1) - u.mixT.value) * Math.min(1, dt * 5);
    u.t.value = t;
    u.gain.value += ((current === c ? 1.15 : hover === c ? 1.1 : 1.0) - u.gain.value) * Math.min(1, dt * 5);
    u.noise.value = Math.max(0, 1 - Math.abs(u.mixT.value - 0.5) * 3.0) * 0.15;
  }

  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = fovFor(camera.aspect); camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  if (current && mode === 'focus') { const { pos, quat } = focusPose(current); camera.position.copy(pos); camera.quaternion.copy(quat); }
});

window.__arcade = { camera, cabinets, focusOn, backToOverview, step, get mode() { return mode; }, get current() { return current; } };
</script>
